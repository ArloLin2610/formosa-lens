name: Build data and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    # Taipei 16:00 (closing prices + daily scan) and 07:00 (overnight filings), weekdays.
    - cron: '0 8 * * 1-5'
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Commits the weekly forward-test snapshot (track/<ISO week>.json) back to the repository.
    permissions:
      contents: write
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # always the newest main: runs are serialized, so snapshots committed by the previous run are present
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build daily data (market snapshot, screen, backtest, forward test, market backdrop, chart histories)
        env:
          # If an exchange download keeps failing from the runner, the old Netlify site's function fetches it on our behalf
          # (best effort: it stops working if that Netlify project is paused or deleted).
          FORMOSA_MIRROR_URL: https://formosa-lens-taiwan.netlify.app
        run: npm run data:build
      - name: Record the weekly forward-test snapshot
        # Committed before publishing so a failed publish never loses a week of the record.
        # Pushes made with GITHUB_TOKEN do not start another workflow run.
        run: |
          git add track
          if git diff --cached --quiet; then echo "Snapshot already recorded for this trading day."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "track: lists frozen $(date -u +%F)"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
      - name: Build site
        run: npm run build
      - name: Check that GitHub Pages is turned on
        # Pages has to be enabled once in the repository settings (Settings > Pages > Source: GitHub Actions).
        # Until then the run still succeeds; it just does not publish.
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not set to 'GitHub Actions' yet (Settings > Pages > Source). The site was built but not published."
          fi
      - name: Upload the site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages (free; Netlify is no longer used)
        id: deployment
        uses: actions/deploy-pages@v4
